spring.application.name=demo
server.port=${PORT:8080}
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}

# Base de datos (ver docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webii_tp2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}

# El esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Configuración JWT (mínimo 32 bytes / 256 bits para HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:devSecretKeyForLocalTestingWeb2Tp32026AtLeast64CharactersLongKey}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
